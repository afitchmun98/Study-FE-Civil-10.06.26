<title>API Batch Tools · Interactive Demo</title>
<style>
:root{color-scheme:dark;--bg:#1c1c1e;--card:#2b2b2d;--raised:#323234;--line:#48484a;--text:#f0f0f2;--muted:#b2b2b7;--blue:#0a84ff;--green:#30d078;--yellow:#ffab20;--red:#ff6464}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select,input{color:inherit}button{cursor:pointer;min-height:42px;padding:8px 15px;border:1px solid #626266;border-radius:6px;background:transparent;font-weight:600;line-height:1.35}button:hover:not(:disabled){background:#ffffff0a;border-color:#85858a}button:disabled{opacity:.42;cursor:default}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.primary:hover:not(:disabled){background:#2995ff}button.danger{color:var(--red)}button.small{font-size:14px;min-height:36px;padding:6px 11px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #63b1ff;outline-offset:3px}input:not([type=checkbox]),select{width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1px solid #626266;border-radius:6px;background:#242426}input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue);margin:3px 0}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.25}h2{font-size:21px;line-height:1.3}h3{font-size:17px}small,.caption{font-size:14px;color:var(--muted)}.muted{color:var(--muted)}.wrap{overflow-wrap:anywhere;min-width:0}.page{max-width:1440px;margin:auto;padding:24px}.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;font-size:14px;color:var(--muted)}.demo-bar strong{color:var(--text)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.window{border:1px solid var(--line);border-radius:10px;background:#242426;overflow:hidden;box-shadow:0 12px 50px #0003}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 24px;background:var(--raised);border-bottom:1px solid var(--line)}.header p{margin-top:5px;font-size:14px;color:var(--muted)}.mode{padding:11px 24px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:#67b6ff}.navigation{display:flex;gap:4px;padding:12px 24px 0;border-bottom:1px solid var(--line)}.navigation button{border:0;border-radius:0;padding:11px 17px;color:var(--muted);border-bottom:3px solid transparent}.navigation button.active{border-bottom-color:var(--blue);color:#64b4ff;background:#0a84ff13}.content{padding:22px 24px}.context{display:flex;gap:9px 18px;flex-wrap:wrap;padding:11px 15px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:18px;font-size:14px;color:var(--muted)}.context strong{color:var(--text)}.columns{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.stack{display:grid;gap:18px;min-width:0}.panel{border:1px solid var(--line);border-radius:7px;background:var(--card);overflow:hidden;min-width:0}.panel-pad{padding:18px;display:grid;gap:15px}.panel-title{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}.section-title{display:grid;gap:6px;margin-bottom:2px}.field{display:grid;gap:6px;align-content:start}.field label{font-size:15px;font-weight:600}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.next-step{padding:14px 17px;border-left:3px solid var(--blue);background:#0a84ff12;display:grid;gap:4px}.next-step strong{font-size:16px}.next-step p{font-size:15px;color:#c4dafa}.notice{padding:12px 15px;background:#ffab2010;border:1px solid #ffab204a;border-radius:5px;font-size:15px}.success{background:#30d07810;border-color:#30d0784a}.error{background:#ff646410;border-color:#ff64644a}.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 9px;border-radius:4px;background:#ffffff0a;font-size:13px;font-weight:600;white-space:normal}.pill.good{color:#6de7a2;background:#30d07815}.pill.attention{color:#ffc766;background:#ffab2015}.pill.pending{color:#87c6ff;background:#0a84ff18}.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:#a0a0a5}.dot.good{background:var(--green)}.dot.attention{background:var(--yellow)}.dot.pending{background:var(--blue)}.overview .big{font-size:30px;font-weight:650;line-height:1.3}.overview ul{list-style:none;padding:0;margin:0}.overview li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.overview li:last-child{border-bottom:0}.overview li span{display:flex;align-items:center;gap:9px;color:var(--muted)}progress{display:block;width:100%;height:7px;border:0;border-radius:3px;background:#49494c;accent-color:var(--blue)}progress::-webkit-progress-bar{background:#49494c;border-radius:3px}progress::-webkit-progress-value{background:var(--blue);border-radius:3px}.queue{list-style:none;padding:0;margin:0}.queue li{display:grid;grid-template-columns:27px minmax(0,1fr) auto;align-items:start;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line)}.queue li:last-child{border:0}.queue li>span:first-child{color:var(--muted);font-size:14px;padding-top:2px}.queue .id{font-size:14px;font-weight:600}.queue .question{font-size:14px;color:var(--muted);margin-top:3px}.queue li.current{background:#0a84ff12}.activity-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.activity-title h2{flex:1}.delay-line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;padding-top:15px;border-top:1px solid var(--line)}.review-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.review-nav .actions{gap:8px}.review-nav button{min-width:96px}.review-item-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px}.comparison .value{padding:15px;background:#202022;border:1px solid var(--line);border-radius:5px;min-width:0;overflow-wrap:anywhere}.comparison .value h3{font-size:15px;color:var(--muted);margin-bottom:12px}.comparison .value p{white-space:pre-line;font-size:16px}.meta-row{display:grid;gap:2px;margin:0 0 12px}.meta-row:last-child{margin:0}.meta-row dt{font-size:13px;color:var(--muted)}.meta-row dd{margin:0;font-size:16px}.question-context{padding:14px 17px;border-bottom:1px solid var(--line);font-size:16px;white-space:pre-line}.question-context small{display:block;margin-bottom:5px}.decision-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:15px;border-top:1px solid var(--line)}.decision-row p{font-size:14px;color:var(--muted);max-width:420px}.retry-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.retry-row:last-child{border:0}.retry-row strong{font-size:14px}.retry-row small{display:block;line-height:1.4;margin-top:4px}.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:var(--card)}.footer .hint{font-size:14px;color:var(--muted);max-width:500px}.sample-saved{font-size:14px;border-top:1px solid var(--line);padding-top:14px}.sample-saved strong{color:var(--green)}details>summary{cursor:pointer;font-size:14px;font-weight:600}details .detail-content{margin-top:12px;display:grid;gap:8px;font-size:14px;color:var(--muted)}.log{max-height:200px;overflow:auto}.log p{font-size:13px;border-bottom:1px solid var(--line);padding:7px 0}.bank-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.bank-row p{margin-top:3px;color:var(--muted);white-space:pre-line}.closed{padding:35px 24px;display:grid;gap:20px}.toast{padding:10px 14px;margin-bottom:18px;border:1px solid #30d07855;background:#30d07810;border-radius:5px;font-size:14px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:1000px){.columns{grid-template-columns:minmax(0,1fr) 260px}.page{padding:16px}.header,.content,.footer{padding-left:18px;padding-right:18px}.navigation{padding-left:18px;padding-right:18px}}
@media(max-width:850px){.columns{grid-template-columns:minmax(0,1fr)}.overview{order:2}.comparison{grid-template-columns:1fr 1fr}.demo-bar{flex-wrap:wrap}.form-grid{gap:14px}}
@media(max-width:560px){.page{padding:10px}.header,.content,.footer{padding-left:14px;padding-right:14px}.header{padding-top:16px;padding-bottom:16px}h1{font-size:22px}.header button{padding:7px 12px}.mode{padding:9px 14px}.navigation{padding:8px 6px 0;gap:0}.navigation button{flex:1;font-size:14px;padding:10px 6px;min-width:0}.comparison,.form-grid{grid-template-columns:1fr}.panel-pad{padding:14px}.queue li{grid-template-columns:22px minmax(0,1fr);padding:12px}.queue .pill{grid-column:2;justify-self:start}.retry-row{grid-template-columns:20px minmax(0,1fr)}.retry-row .pill{grid-column:2;justify-self:start}.delay-line{grid-template-columns:1fr}.review-nav{align-items:start}.review-nav .actions{width:100%}.footer>.actions{width:100%}.context{padding:10px 12px}.header p{max-width:200px}.demo-bar .actions{width:100%}.decision-row .actions{width:100%}.decision-row button{flex:1}.demo-bar{margin-bottom:12px}.columns{gap:16px}}
@media(prefers-reduced-motion:no-preference){.processing .dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}}

/* Compact API layout, matching the current app. */
.page{padding:18px}.demo-bar{margin-bottom:12px}.header{padding:14px 18px;gap:12px}.mode{padding:8px 18px}.navigation{padding:8px 18px 0}.navigation button{padding:8px 12px}.content{padding:16px 18px}.context{padding:8px 12px;margin-bottom:12px}.columns{grid-template-columns:minmax(0,1fr) 260px;gap:14px}.stack{gap:12px}.panel-pad{padding:14px;gap:10px}.panel-title{padding:12px 14px}.form-grid{gap:12px}.overview li{padding:6px 0}.overview .big{font-size:26px}.comparison{gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}.comparison .value{padding:12px;border:0;border-radius:0}.comparison .value+.value{border-left:1px solid var(--line)}.review-controls .review-nav{align-items:end;justify-content:start}.review-controls .field{flex:1 1 230px;min-width:0}.bulk-actions{padding-top:10px;border-top:1px solid var(--line)}.recovery{margin-bottom:12px;grid-template-columns:minmax(0,1fr) auto;align-items:start}.recovery details{grid-column:1/-1}.recovery summary,.overview summary{font-size:14px;color:var(--muted);cursor:pointer}.recovery h3{margin-bottom:4px}.recovery .actions{max-width:450px}.footer{padding:12px 18px}.toast{margin-bottom:12px}.next-step{padding:10px 14px}.decision-row{gap:10px;padding-top:10px}.sample-saved{padding-top:10px}
@media(max-width:850px){.columns{grid-template-columns:minmax(0,1fr)}.comparison{grid-template-columns:minmax(0,1fr)}.comparison .value+.value{border-left:0;border-top:1px solid var(--line)}.recovery{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.page{padding:6px}.header,.content,.footer{padding:12px}.header{flex-wrap:wrap}.header>div:first-child{flex:1 1 100%}.navigation{padding:6px 8px 0}.navigation button{padding:8px 5px}.form-grid{grid-template-columns:minmax(0,1fr)}.review-controls .field{flex-basis:100%;order:-1}.recovery .actions{max-width:100%}}
</style>
</head>
<body>
<div class="page">
  <div class="demo-bar"><div><strong>Interactive demo</strong> · Sample questions only. No API key, network calls, or changes to your app.</div><div class="actions"><button class="small" data-action="prepared">Load review sample</button><button class="small" data-action="reset">Reset demo</button></div></div>
  <div class="window" id="window"></div>
  <div role="status" aria-live="polite" class="sr-only" id="announcer"></div>
</div>
<script>
'use strict';
// Self-contained sample data. This file never opens the app's database or calls a provider.
const clone = value => JSON.parse(JSON.stringify(value));
const samples = [
 {id:'FE-DEMO-001',raw:'A soil sample has a total volume of 1.20 ft3 and a void volume of 0.48 ft3. What is the porosity?',clean:'A soil sample has a total volume of 1.20 ft³ and a void volume of 0.48 ft³. What is its porosity?',topic:'Geotechnical Engineering',subtopic:'Soil phase relationships',answer:'40%',solution:'Porosity is the void volume divided by the total volume.\n\nn = Vᵥ / V = 0.48 / 1.20 = 0.40\n\nThe porosity is 40%, which agrees with the stored answer key.'},
 {id:'FE-DEMO-002',raw:'Water flows through a pipe at Q=0.12 m3/s. The cross sectional area is 0.03 m2. Find the average velocity.',clean:'Water flows through a pipe at 0.12 m³/s. The cross-sectional area is 0.03 m². Find the average velocity.',topic:'Fluid Mechanics',subtopic:'Continuity equation',answer:'4.0 m/s',solution:'For steady flow, Q = Av.\n\nv = Q / A = 0.12 / 0.03 = 4.0 m/s\n\nThe average velocity is 4.0 m/s.'},
 {id:'FE-DEMO-003',raw:'The loads 10, 20 and 30 kN act at distances of 1, 2 and 3 meters from point A. Determine the total clockwise moment.',clean:'Clockwise loads of 10, 20, and 30 kN act at distances of 1, 2, and 3 m from point A. Determine their total moment about A.',topic:'Statics',subtopic:'Moments',answer:'140 kN·m',solution:'Add the moments about A using M = Fd.\n\nM = (10 × 1) + (20 × 2) + (30 × 3)\nM = 10 + 40 + 90 = 140 kN·m\n\nThe total moment is 140 kN·m clockwise.'},
 {id:'FE-DEMO-004',raw:'A road is 400 m long and 6 m wide. An asphalt layer is 0.05 m thick. What volume of asphalt is required?',clean:'A road is 400 m long and 6 m wide. The asphalt layer is 0.05 m thick. What volume of asphalt is required?',topic:'Transportation Engineering',subtopic:'Pavement quantities',answer:'120 m³',solution:'Multiply the length, width, and thickness.\n\nV = 400 × 6 × 0.05 = 120 m³\n\nThe required asphalt volume is 120 m³.'},
 {id:'FE-DEMO-005',raw:'A concrete specimen carries 300 kN over a cross sectional area of 0.015 m2. Calculate its compressive stress.',clean:'A concrete specimen carries a load of 300 kN over a cross-sectional area of 0.015 m². Calculate the compressive stress.',topic:'Mechanics of Materials',subtopic:'Normal stress',answer:'20 MPa',solution:'Normal stress is the load divided by the area.\n\nσ = P / A = 300,000 / 0.015 = 20,000,000 Pa\n\nThe compressive stress is 20 MPa.'},
 {id:'FE-DEMO-006',raw:'The values 2, 4, 6, and 8 are recorded. What is their arithmetic mean?',clean:'The values 2, 4, 6, and 8 are recorded. What is their arithmetic mean?',topic:'Mathematics and Statistics',subtopic:'Descriptive statistics',answer:'5',solution:'The arithmetic mean is the sum of the values divided by their count.\n\nMean = (2 + 4 + 6 + 8) / 4 = 20 / 4 = 5\n\nThe arithmetic mean is 5.'}
];
const taskNames={solution:'Generate worked solutions',metadata:'Reclassify topics and subtopics',text:'Format question text'};
const statusNames={queued:'Awaiting request',processing:'Generating',pending:'Review required',unchanged:'No visible change',reviewed_unchanged:'Reviewed unchanged',accepted:'Accepted',rejected:'Rejected',failed:'Needs retry',skipped:'Skipped',cancelled:'Stopped',interrupted:'Interrupted'};
const storageKey='fe-api-batch-standalone-demo-v1';
function fresh(){return {schema:1,task:'solution',scenario:'normal',delay:0.7,stage:'setup',open:true,run:null,bank:samples.map(q=>({id:q.id,text:q.raw,topic:'Unclassified',subtopic:'Not assigned',solution:''})),message:'',confirm:''};}
let state=fresh(), timer=null, revision=0, runtime={timerUntil:0};
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved?.schema===1&&saved.bank?.length===samples.length&&['solution','metadata','text'].includes(saved.task)){state=saved;state.confirm='';state.message='';if(state.run?.status==='active'){state.run.status='interrupted';state.run.paused=true;state.run.items.forEach(i=>{if(['queued','processing'].includes(i.status))i.status='interrupted';});state.stage='finish';state.message='The demo run was interrupted by a reload. Saved decisions are kept; choose which questions to retry.';}}}catch{}
const $=selector=>document.querySelector(selector);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reviewed=i=>['accepted','rejected','reviewed_unchanged'].includes(i.status);
const unfinished=i=>!['rejected','skipped'].includes(i.status)&&(['queued','processing','failed','cancelled','interrupted'].includes(i.status)||i.retryAttention);
const needsRetry=i=>i.retryAttention||['failed','skipped','cancelled','interrupted','rejected'].includes(i.status);
const bankItem=i=>state.bank.find(q=>q.id===i.id);
const sample=i=>samples.find(q=>q.id===i.id);
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{}}
function announce(message){$('#announcer').textContent=message;}
function note(message){state.message=message;announce(message);}
function log(message){if(state.run){state.run.log.push(message);state.run.log=state.run.log.slice(-30);}}
function counts(){const a=state.run?.items||[];return {total:a.length,accepted:a.filter(i=>i.status==='accepted').length,rejected:a.filter(i=>i.status==='rejected').length,pending:a.filter(i=>['pending','unchanged'].includes(i.status)).length,attention:a.filter(needsRetry).length,waiting:a.filter(i=>['queued','processing'].includes(i.status)).length,reviewed:a.filter(reviewed).length};}
function tone(status){return ['accepted','reviewed_unchanged'].includes(status)?'good':['pending','processing'].includes(status)?'pending':['failed','rejected','skipped','cancelled','interrupted'].includes(status)?'attention':'';}
function pill(status){return `<span class="pill ${tone(status)} ${status==='processing'?'processing':''}"><span class="dot ${tone(status)}"></span>${escapeHTML(statusNames[status]||status)}</span>`;}
function valueMarkup(value){if(state.task==='metadata')return `<dl class="meta-row"><dt>Topic</dt><dd>${escapeHTML(value.topic)}</dd></dl><dl class="meta-row"><dt>Subtopic</dt><dd>${escapeHTML(value.subtopic)}</dd></dl>`;const content=state.task==='text'?value.text:value.solution;return `<p class="${content?'':'muted'}">${escapeHTML(content||'No saved solution.')}</p>`;}
function sameValue(a,b){return state.task==='metadata'?a.topic===b.topic&&a.subtopic===b.subtopic:state.task==='text'?a.text===b.text:a.solution===b.solution;}
function applyFields(current,value){if(state.task==='metadata'){current.topic=value.topic;current.subtopic=value.subtopic;}else if(state.task==='text')current.text=value.text;else current.solution=value.solution;}
function proposal(i){const current=clone(bankItem(i)),q=sample(i);if(state.task==='metadata'){current.topic=q.topic;current.subtopic=q.subtopic;}else if(state.task==='text')current.text=q.clean;else current.solution=q.solution;return current;}
function recovery(){const r=state.run,n=r.items.filter(unfinished).length;if(r.status==='active'||!n)return '';return `<section class="panel panel-pad recovery" data-recovery><div><h3>${r.accessBlock?'API usage exhausted — progress saved':'Saved task ready to continue'}</h3><p class="caption">${n} unfinished question${n===1?'':'s'} · proposals and decisions kept.</p></div><div class="actions">${r.accessBlock?'<button data-action="restore-access">Simulate Restored API Access</button>':''}<button class="primary" data-action="resume-work" ${r.accessBlock?'disabled':''}>Resume Unfinished Work (${n})</button></div><details><summary>About resuming</summary><p class="caption">Resume continues unfinished questions. Retry regenerates selected questions. In the app, update API access in Settings before resuming.</p></details></section>`;}
function resumeWork(){const r=state.run;if(!r||r.status==='active'||r.accessBlock)return;const ids=r.items.filter(unfinished).map(i=>i.id);if(!ids.length)return;halt();r.queue=ids;r.status='active';r.paused=false;r.current='';state.stage='activity';state.confirm='';r.items.forEach(i=>{if(ids.includes(i.id)&&!i.proposed)i.status='queued';});note(`Resuming ${ids.length} unfinished question${ids.length===1?'':'s'}. Earlier proposals and review decisions are kept.`);log('Saved run resumed. Completed questions will not be generated again.');render();pump();}
function overview(){const c=counts(),changed=state.bank.filter((q,n)=>JSON.stringify(q)!==JSON.stringify(fresh().bank[n])).length;return `<aside class="panel panel-pad overview"><h3>Task overview</h3><p><span class="big">${c.reviewed}</span> <span class="muted">of ${c.total} reviewed</span></p><progress value="${c.reviewed}" max="${c.total||1}" aria-label="Questions reviewed"></progress><ul><li><span><i class="dot good"></i>Accepted</span><strong>${c.accepted}</strong></li><li><span><i class="dot"></i>Reviewed unchanged</span><strong>${state.run.items.filter(i=>i.status==='reviewed_unchanged').length}</strong></li><li><span><i class="dot attention"></i>Rejected</span><strong>${c.rejected}</strong></li><li><span><i class="dot pending"></i>Awaiting review</span><strong>${c.pending}</strong></li><li><span><i class="dot attention"></i>Needs retry</span><strong>${c.attention}</strong></li><li><span><i class="dot"></i>Awaiting request</span><strong>${c.waiting}</strong></li></ul><details><summary>Saving &amp; closing</summary><p class="caption">Accept saves. Revisit accepted questions to restore originals while the task is open. Close keeps generation running; Save &amp; Exit stops and saves progress.</p></details><div class="sample-saved"><strong>${changed} sample question${changed===1?'':'s'} changed</strong><p class="caption">Generation alone does not save proposals.</p></div><details><summary>Inspect sample bank</summary><div class="detail-content">${state.bank.map(q=>`<div class="bank-row"><strong>${escapeHTML(q.id)}</strong>${valueMarkup(q)}</div>`).join('')}</div></details></aside>`;}
function setup(){return `<div class="columns"><div class="stack"><div class="section-title"><h2>Set up an API batch</h2><p class="muted">Choose a task and see proposals generated for six sample questions.</p></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label for="task">Task</label><select id="task" data-control="task">${Object.entries(taskNames).map(([v,l])=>`<option value="${v}" ${state.task===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="scenario">Simulated run</label><select id="scenario" data-control="scenario"><option value="normal" ${state.scenario==='normal'?'selected':''}>Normal generation</option><option value="rate" ${state.scenario==='rate'?'selected':''}>Rate limit on question 3</option><option value="failure" ${state.scenario==='failure'?'selected':''}>One failed response</option><option value="quota" ${state.scenario==='quota'?'selected':''}>API usage exhausted on question 3</option></select></div><div class="field"><label for="delay">Delay between requests (seconds)</label><input id="delay" data-control="delay" type="number" min="0" max="30" step="0.1" value="${state.delay}"><small>Also adjustable while the batch is running.</small></div><div class="field"><label>Provider</label><div class="notice success">Simulated provider · no API key needed</div><small>Each pretend response takes about 0.8 seconds.</small></div></div></div><div class="next-step"><strong>Next: generate proposals</strong><p>Then review each proposal. Only the changes you accept are saved.</p></div><details class="panel panel-pad"><summary>Questions in this demo (6)</summary><div class="detail-content">${samples.map(q=>`<p><strong>${q.id}</strong> · ${escapeHTML(q.clean)}</p>`).join('')}</div></details></div><aside class="panel panel-pad"><h3>Two ways to try it</h3><p>Start a run to try Pause, Skip, Stop, and request spacing.</p><p>Use <strong>Load review sample</strong> above to jump straight to comparisons, accepting, undoing, and retries.</p><div class="notice">This is a walkthrough of the API workflow, with a subset of the app’s tasks. AI output and errors are scripted.</div></aside></div>`;}
function queue(){return `<div class="panel"><div class="panel-title">Questions in this run (${state.run.items.length})</div><ol class="queue">${state.run.items.map((i,n)=>`<li class="${i.status==='processing'?'current':''}"><span>${n+1}.</span><div><div class="id">${escapeHTML(i.id)}</div><div class="question">${escapeHTML(sample(i).clean)}</div>${i.error?`<p class="caption">${escapeHTML(i.error)}</p>`:''}</div>${pill(i.status)}</li>`).join('')}</ol></div>`;}
function activity(){const r=state.run,c=counts(),current=r.items.find(i=>i.status==='processing'),active=r.status==='active';return `<div class="columns"><div class="stack"><div class="panel panel-pad"><div class="activity-title"><h2 id="live-title">${escapeHTML(liveTitle())}</h2>${pill(active&&current?'processing':active?'queued':'pending')}</div><p class="muted wrap" id="live-detail">${escapeHTML(liveDetail())}</p><progress value="${r.items.filter(i=>i.attempts>0).length}" max="${c.total}" aria-label="Generation progress"></progress><p class="caption">${r.items.filter(i=>i.attempts>0).length} of ${c.total} processed · ${c.pending} ready for review</p><div class="actions"><button data-action="pause" ${active?'':'disabled'}>${r.paused?'Resume':'Pause'}</button><button data-action="skip" ${active&&current?'':'disabled'}>Skip Current Question</button><button class="danger" data-action="stop" ${active?'':'disabled'}>Stop Batch</button><button data-action="save-exit">Save & Exit</button></div><div class="delay-line"><div class="field"><label for="live-delay">Request delay</label><input id="live-delay" data-control="delay" type="number" min="0" max="30" step="0.1" value="${state.delay}"></div><p class="caption">Seconds between requests. Pause lets the current response finish; Stop keeps results already available for review.</p></div>${r.rateUntil>Date.now()?`<div class="notice">The provider returned a rate limit. This demo uses a 5-second cooldown; the app uses the provider’s cooldown or its fallback. Resume continues the remaining questions. The failed question stays available to retry.</div>`:''}</div><div class="next-step"><strong>${c.pending?'Next: review available proposals':active?'Next: wait for a proposal':'Next: review results or retry unfinished questions'}</strong><p>${c.pending?(active?'You can review now while generation continues.':'Review these proposals now, or resume unfinished work when ready.'):active?'You can pause or stop at any time. Saved questions will stay unchanged until you accept.':'Open Finish & Retry to choose which questions to run again.'}</p></div>${queue()}<details class="panel panel-pad"><summary>Activity log</summary><div class="detail-content log">${r.log.map(l=>`<p>${escapeHTML(l)}</p>`).join('')}</div></details></div>${overview()}</div>`;}
function liveTitle(){const r=state.run;if(!r)return '';return r.status!=='active'?r.status==='interrupted'?'Run interrupted':r.status==='suspended'?'Progress saved · run suspended':r.status==='stopped'?'Batch stopped':'Generation finished':r.paused?'Paused':runtime.timerUntil>Date.now()?'Waiting between requests':'Generating proposals';}
function liveDetail(){const r=state.run;if(!r)return '';const current=r.items.find(i=>i.status==='processing');if(r.paused){if(r.rateUntil>Date.now())return `Rate-limit cooldown: ${Math.ceil((r.rateUntil-Date.now())/1000)} seconds remaining.`;return current?`${current.id} is finishing. No next request will start until you resume.`:'Resume when you are ready.';}if(runtime.timerUntil>Date.now())return `${Math.max(0.1,(runtime.timerUntil-Date.now())/1000).toFixed(1)} seconds until the next request.`;return current?`${current.id} · Simulating a provider response.`:r.accessBlock?'Restore API access, then resume unfinished work.':r.status==='suspended'?'Resume unfinished work when you are ready.':'All available results can now be reviewed.';}
function review(){const r=state.run,c=counts(),i=r.items[r.index],q=sample(i),canAccept=['pending','unchanged','rejected'].includes(i.status)&&i.proposed;return `<div class="columns"><div class="stack"><div class="section-title"><h2>Review proposals</h2><p class="caption">Compare the content, then accept or reject. Decisions can be revisited.</p></div><div class="panel panel-pad review-controls"><div class="review-nav"><div class="actions"><button data-action="previous" ${r.index===0?'disabled':''}>Previous</button><button data-action="next" ${r.index===r.items.length-1?'disabled':''}>Next</button></div><div class="field"><label for="jump">Go to question (${r.index+1} of ${r.items.length})</label><select id="jump" data-control="jump">${r.items.map((x,n)=>`<option value="${n}" ${n===r.index?'selected':''}>${n+1}. ${x.id} — ${statusNames[x.status]}</option>`).join('')}</select></div></div><div class="actions bulk-actions"><button data-action="accept-all" ${c.pending||r.items.some(x=>x.status==='rejected'&&x.proposed)?'':'disabled'}>Accept All Available</button><button data-action="reject-all" ${r.items.some(x=>x.proposed&&!['rejected','reviewed_unchanged'].includes(x.status))?'':'disabled'}>Reject All Available</button><span class="caption">Applies to proposals already generated.</span></div></div><div class="panel"><div class="question-context"><small>Question · stored answer key: ${escapeHTML(q.answer)}</small>${escapeHTML(q.clean)}</div><div class="panel-pad"><div class="review-item-header"><h3 class="wrap">${escapeHTML(i.id)}</h3>${pill(i.status)}</div>${i.proposed?`<div class="comparison"><div class="value"><h3>Original ${state.task==='metadata'?'metadata':state.task==='text'?'question text':'solution'}</h3>${valueMarkup(i.before)}</div><div class="value"><h3>Proposed ${state.task==='metadata'?'metadata':state.task==='text'?'question text':'solution'}</h3>${valueMarkup(i.proposed)}</div></div>${i.status==='accepted'?'<div class="notice success">Saved to the sample bank. Reject & Restore Original reverses this acceptance.</div>':i.status==='rejected'?'<div class="notice">Rejected. The original is saved; you can accept this proposal again or retry.</div>':'<p class="caption">This proposal has not been saved. Accept to apply it; Reject to keep the original.</p>'}`:`<div class="notice">${i.status==='processing'?'A response is being generated. You can review another question while it finishes.':i.status==='queued'?'This question is waiting for a request. Open Activity to follow the run.':'No proposal is available for this question. Retry it from Finish & Retry.'}</div>`}${i.error?`<div class="notice">${escapeHTML(i.error)}</div>`:''}<div class="decision-row"><p>${i.status==='accepted'?'You can revisit and undo this decision before ending the task.':i.status==='unchanged'?'The proposal matches the saved question. Mark it reviewed to continue.':r.index===r.items.length-1?'Last question. Open Finish & Retry after making your decision.':'Accept & Next saves, then advances to the next question.'}</p><div class="actions">${i.status==='accepted'?'<button data-action="reject">Reject & Restore Original</button>':i.status==='reviewed_unchanged'?'<span class="pill good">Reviewed · no change saved</span>':`<button data-action="reject-next" ${i.proposed?'':'disabled'}>Reject & Next</button><button class="primary" data-action="accept-next" ${canAccept?'':'disabled'}>${i.status==='unchanged'?'Mark Reviewed & Next':'Accept & Next'}</button>`}<button data-action="retry-one" ${r.status==='active'?'disabled':''}>Retry This Question</button></div></div></div></div><div class="next-step"><strong>${c.reviewed===c.total?'Review complete':c.pending?'Next: make a decision on the available proposals':'Next: check unfinished questions'}</strong><p>${c.reviewed===c.total?'Finish the task, or choose rejected questions to retry.':c.pending?'Use Previous, Next, or Go to question to revisit any decision.':'Finish & Retry includes failed, skipped, stopped, and rejected questions.'}</p></div></div>${overview()}</div>`;}
function finish(){const r=state.run,c=counts(),retry=r.items.filter(needsRetry),selected=retry.filter(i=>i.retrySelected).length;return `<div class="columns"><div class="stack"><div class="section-title"><h2>Finish & Retry</h2><p class="muted">Accepted changes are saved. Choose whether to retry, keep reviewing, or end the task.</p></div>${r.status==='active'?'<div class="notice">Generation is still running. Stop the batch before starting a retry or ending the task.</div>':''}${c.pending?`<div class="notice">${c.pending} proposal${c.pending===1?' is':'s are'} still awaiting review. <button class="small" data-action="phase" data-phase="review">Return to Review</button></div>`:''}<div class="panel panel-pad"><div class="review-item-header"><h3>Questions available to retry (${retry.length})</h3><span class="caption">${selected} selected</span></div><p class="caption">Rejected and unfinished questions start selected. Clear any you want to leave out. A retry generates a new proposal for review.</p>${retry.length?`<div class="actions"><button class="small" data-action="select-retries">Select all</button><button class="small" data-action="clear-retries">Clear all</button></div><div>${retry.map(i=>`<label class="retry-row"><input type="checkbox" data-retry-id="${i.id}" ${i.retrySelected?'checked':''}><span><strong>${i.id}</strong><small>${escapeHTML(sample(i).clean)}</small>${i.error?`<small>${escapeHTML(i.error)}</small>`:''}</span>${pill(i.status)}</label>`).join('')}</div><div class="actions"><button class="primary" data-action="retry-selected" ${selected&&r.status!=='active'?'':'disabled'}>Retry ${selected} Selected Question${selected===1?'':'s'}</button></div>`:'<div class="notice success">No questions need retry attention.</div>'}</div><div class="next-step"><strong>Next: end the task when you are finished</strong><p>This keeps accepted changes and clears the demo’s review session. Reset Demo also restores the original sample bank.</p></div>${state.confirm==='end'?`<div class="panel panel-pad"><h3>End this task?</h3><p>${c.accepted} accepted change${c.accepted===1?'':'s'} will be kept. ${c.pending+c.waiting+c.attention} question${c.pending+c.waiting+c.attention===1?'':'s'} may still need review or retry. The review session will close.</p><div class="actions"><button data-action="cancel-end">Keep Reviewing</button><button class="primary" data-action="end-confirm">End Task & Keep Accepted</button></div></div>`:''}</div>${overview()}</div>`;}
function completion(){return `<div class="panel panel-pad"><h2>Task finished</h2><p>${escapeHTML(state.message||'Your accepted sample changes were kept.')}</p><div class="notice success">The review session is closed. This affected only the demo’s sample bank.</div><details><summary>Inspect saved sample questions</summary><div class="detail-content">${state.bank.map(q=>`<div class="bank-row"><strong>${q.id}</strong>${valueMarkup(q)}</div>`).join('')}</div></details><div class="actions"><button class="primary" data-action="new-run">Start Another Demo Run</button><button data-action="reset">Reset Original Samples</button></div></div>`;}
function footer(){if(!state.run)return state.stage==='done'?'<p class="hint">This file works offline. Your actual Question Bank is unchanged.</p>':`<p class="hint">Six sample questions · output is staged before saving.</p><div class="actions"><button class="primary" data-action="start">Generate Proposals</button></div>`;if(state.stage==='activity')return `<p class="hint">${counts().pending} available to review. ${state.run.status==='active'?'You can review while generation continues.':'Saved proposals are ready for review.'}</p><div class="actions"><button data-action="phase" data-phase="finish">Finish & Retry</button><button class="primary" data-action="phase" data-phase="review">Review Available Results</button></div>`;if(state.stage==='review')return '<button data-action="save-exit">Save & Exit</button><p class="hint">Accept saves. Reject restores accepted changes while the task is open.</p><div class="actions"><button data-action="phase" data-phase="activity">View Activity</button><button class="primary" data-action="phase" data-phase="finish">Finish & Retry</button></div>';return `<button data-action="save-exit">Save & Exit</button><p class="hint">End Task keeps accepted changes and closes this review session.</p><div class="actions"><button data-action="phase" data-phase="review">Return to Review</button><button class="primary" data-action="end" ${state.run.status==='active'?'disabled':''}>End Task</button></div>`;}
function render(){persist();const previousFocus=document.activeElement?.getAttribute('data-control'),previousScroll=window.scrollY;if(!state.open){$('#window').innerHTML=`<div class="header"><div><h1>API Batch Tools demo</h1><p>Task window closed</p></div></div><div class="closed"><h2>${state.run?'Your task is still available':'Demo ready'}</h2><p class="muted" id="closed-status">${state.run?.status==='active'?'The simulated run continues in the background. Reopen it to review or stop.':state.run?'Progress saved. Reopen to continue unfinished work or return to your review.':'Reopen the window to continue exploring.'}</p><div class="actions"><button class="primary" data-action="reopen">Reopen Batch Tools</button></div></div>`;return;}
const stages=[['setup','Setup'],['activity','Activity'],['review','Review'],['finish','Finish & Retry']];
$('#window').innerHTML=`<div class="header"><div><h1>AI Batch Tools</h1><p>Automatic API workflow · interactive demo</p></div><div class="actions">${state.run?'<button data-action="start-over">Start Over</button>':''}<button data-action="close">Close</button></div></div><div class="mode">API Batch <span class="muted">· simulated provider</span></div><nav class="navigation" aria-label="Batch workflow">${stages.map(([v,l])=>`<button data-action="phase" data-phase="${v}" ${state.stage===v?'class="active" aria-current="step"':''} ${(v==='setup'&&state.run)||(v!=='setup'&&!state.run)?'disabled':''}>${l}</button>`).join('')}</nav><main class="content">${state.run?`<div class="context"><strong>${escapeHTML(taskNames[state.task])}</strong><span>${state.run.items.length} sample questions</span><span>No API calls</span></div>`:''}${state.message&&state.stage!=='done'?`<div class="toast" role="status">${escapeHTML(state.message)}</div>`:''}${state.run?recovery():''}${state.stage==='setup'?setup():state.stage==='activity'?activity():state.stage==='review'?review():state.stage==='finish'?finish():completion()}</main><footer class="footer">${footer()}</footer>`;
if(previousFocus&&previousFocus==='delay')$(`[data-control="${previousFocus}"]`)?.focus({preventScroll:true});window.scrollTo(0,previousScroll);}
function newRun(prepared=false){halt();state.confirm='';state.message='';state.open=true;state.run={status:prepared?'complete':'active',paused:false,rateUntil:0,index:0,queue:[],log:[],items:samples.map(q=>({id:q.id,status:'queued',before:null,proposed:null,attempts:0,error:'',retrySelected:true,retryAttention:false}))};if(prepared){state.run.items.forEach((i,n)=>{i.attempts=1;if(n===4){i.status='failed';i.error='Simulated incomplete provider response. Retry to generate a fresh proposal.';return;}i.before=clone(bankItem(i));i.proposed=proposal(i);if(n===5)i.proposed=clone(i.before);i.status=sameValue(i.before,i.proposed)?'unchanged':'pending';});state.stage='review';log('Loaded five proposals and one failed response for review.');note('Review sample loaded. Nothing has been saved to the sample bank.');render();}else{state.stage='activity';state.run.queue=state.run.items.map(i=>i.id);log('Generation started. Proposals will be staged for review.');render();pump();}}
function halt(){revision++;clearTimeout(timer);timer=null;runtime.timerUntil=0;}
function schedule(callback,ms){const token=revision;clearTimeout(timer);timer=setTimeout(()=>{timer=null;if(token===revision)callback();},ms);}
function pump(){const r=state.run;if(!r||r.status!=='active')return;if(r.paused)return;if(r.rateUntil>Date.now()){runtime.timerUntil=r.rateUntil;schedule(()=>{runtime.timerUntil=0;pump();},r.rateUntil-Date.now());if(state.stage==='activity')render();return;}const id=r.queue.shift();if(!id){r.status='complete';r.current='';runtime.timerUntil=0;log('Run finished. Proposals remain unsaved until accepted.');note('Generation finished. Review your proposals, then open Finish & Retry.');render();return;}const i=r.items.find(x=>x.id===id);i.previousStatus=i.status;i.status='processing';i.attempts++;r.current=id;runtime.timerUntil=0;log(`Request started: ${id}`);render();schedule(()=>receive(i),800);}
function receive(i){const r=state.run;if(!r||r.status!=='active')return;if(state.scenario==='quota'&&i.id==='FE-DEMO-003'&&i.attempts===1){i.status='failed';i.error='Simulated API usage allowance exhausted. Progress is saved.';i.retrySelected=true;r.status='suspended';r.accessBlock=true;r.current='';r.items.forEach(x=>{if(x.status==='queued')x.status='interrupted';});log('API usage exhausted. Saved task suspended; no further requests made.');note('API usage exhausted. Simulate restored API access, then resume unfinished work.');render();return;}const fail=state.scenario==='failure'&&i.id==='FE-DEMO-004'&&i.attempts===1,rate=state.scenario==='rate'&&i.id==='FE-DEMO-003'&&i.attempts===1;if(fail||rate){if(i.proposed){i.status=i.previousStatus;i.retryAttention=true;}else i.status='failed';i.error=rate?'Simulated 429 rate limit. Retry this question after the cooldown.':'Simulated incomplete response. Retry this question.';i.retrySelected=true;log(`${i.id}: ${rate?'Rate limit; batch paused.':'Response failed; continuing.'}`);if(rate){r.paused=true;r.rateUntil=Date.now()+5000;}}else{i.before=clone(bankItem(i));i.proposed=proposal(i);i.status=sameValue(i.before,i.proposed)?'unchanged':'pending';i.error='';i.retryAttention=false;delete i.acceptedValue;log(`${i.id}: proposal staged; saved question unchanged.`);}r.current='';r.lastResponse=Date.now();note(rate?'Rate limit simulated. Resume after the cooldown, then retry question 3 at the end.':`Response for ${i.id} is ready. No proposal was automatically saved.`);render();afterResponse();}
function afterResponse(){const r=state.run;if(!r||r.status!=='active'||r.paused)return;if(!r.queue.length){pump();return;}runtime.timerUntil=(r.lastResponse||Date.now())+state.delay*1000;if(runtime.timerUntil<=Date.now()){runtime.timerUntil=0;pump();return;}if(state.stage==='activity')render();schedule(()=>{runtime.timerUntil=0;pump();},runtime.timerUntil-Date.now());}
function pause(){const r=state.run;if(!r||r.status!=='active')return;if(r.paused){if(r.rateUntil>Date.now()){note(`Cooldown has ${Math.ceil((r.rateUntil-Date.now())/1000)} seconds remaining. Resume after it expires.`);render();return;}r.paused=false;log('Run resumed.');note('Resumed. Continuing with remaining questions.');render();if(!r.current)afterResponse();}else{r.paused=true;if(!r.current){clearTimeout(timer);timer=null;runtime.timerUntil=0;}log('Pause requested.');note(r.current?'Pause requested. The current response will finish; the next request will wait.':'Paused. No next request will start until you resume.');render();}}
function stop(){const r=state.run;if(!r||r.status!=='active')return;halt();r.items.forEach(i=>{if(['queued','processing'].includes(i.status)){if(i.proposed){i.status=i.previousStatus;i.retryAttention=true;}else i.status='cancelled';i.error='Stopped before a new proposal was available.';i.retrySelected=true;}});r.status='stopped';r.paused=false;r.current='';r.queue=[];log('Batch stopped. Earlier proposals and review decisions were kept.');note('Batch stopped. Review available results or retry the unfinished questions.');render();}
function skip(){const r=state.run;if(!r||r.status!=='active'||!r.current)return;const i=r.items.find(x=>x.id===r.current);halt();if(i.proposed){i.status=i.previousStatus;i.retryAttention=true;}else i.status='skipped';i.error='Skipped this request. Available to retry later.';i.retrySelected=true;r.current='';r.lastResponse=Date.now();log(`${i.id}: skipped.`);note('Question skipped. Earlier proposals are kept.');render();afterResponse();}
function decide(i,decision){if(!i.proposed)return false;const current=bankItem(i);if(decision==='accept'){if(i.status==='accepted'||i.status==='reviewed_unchanged')return false;if(!sameValue(current,i.before)){i.retryAttention=true;i.error='The sample question changed after staging. Retry to use the current saved content.';return false;}applyFields(current,i.proposed);i.acceptedValue=clone(i.proposed);i.status=sameValue(i.before,i.proposed)?'reviewed_unchanged':'accepted';i.retrySelected=false;log(`${i.id}: accepted.`);}else{if(i.status==='accepted'){if(!sameValue(current,i.acceptedValue)){i.retryAttention=true;i.error='Later edits were kept. The old acceptance cannot overwrite them.';return false;}applyFields(current,i.before);}i.status='rejected';i.retrySelected=true;log(`${i.id}: rejected; original saved fields kept.`);}return true;}
function decision(action){const r=state.run,i=r.items[r.index],accept=action.startsWith('accept');if(decide(i,accept?'accept':'reject')){note(accept?`${i.id}: ${i.status==='reviewed_unchanged'?'marked reviewed, unchanged':'accepted and saved to the sample bank'}.`:`${i.id}: rejected${i.acceptedValue?' and original restored':''}.`);if(action.endsWith('-next')&&r.index<r.items.length-1)r.index++;}render();}
function bulk(accept){let changed=0;state.run.items.forEach(i=>{if(i.proposed&&['pending','unchanged','rejected','accepted'].includes(i.status)&&decide(i,accept?'accept':'reject'))changed++;});note(`${changed} available proposal${changed===1?'':'s'} ${accept?'accepted':'rejected'}. ${accept?'Accepted changes are now saved in the sample bank.':'Accepted changes were restored where applicable.'}`);render();}
function retry(ids){const r=state.run;if(!r||r.status==='active'||!ids.length)return;halt();r.queue=ids.slice();r.status='active';r.paused=false;r.rateUntil=0;r.lastResponse=0;r.current='';r.items.forEach(i=>{if(ids.includes(i.id)&&!i.proposed)i.status='queued';});state.stage='activity';state.confirm='';note(`Retrying ${ids.length} selected question${ids.length===1?'':'s'}. New responses must be reviewed again.`);log(`Retry started: ${ids.join(', ')}`);render();pump();}
function startOver(){if(!state.run)return;const accepted=counts().accepted;if(!confirm(`Start over with a new API task?\n\nThe current run will stop. Unaccepted proposals, unfinished work, and review history will be discarded.\n\n${accepted} accepted sample question${accepted===1?'':'s'} will stay saved. This task can no longer undo them.`))return;halt();state.run=null;state.stage='setup';state.confirm='';state.open=true;note(`Ready for a new API task. ${accepted} accepted sample question${accepted===1?'':'s'} kept.`);render();}
function endTask(){const accepted=counts().accepted;halt();state.run=null;state.stage='done';state.confirm='';state.message=`Task ended. ${accepted} accepted change${accepted===1?' was':'s were'} kept in the sample bank.`;announce(state.message);render();}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,r=state.run;
if(action==='start-over'){startOver();}
else if(action==='save-exit'){if(r?.status==='active'){stop();r.status='suspended';}state.open=false;note('Progress saved. Reopen Batch Tools to resume unfinished work.');render();}
else if(action==='resume-work'){resumeWork();}
else if(action==='restore-access'){r.accessBlock=false;note('API access restored for this simulation. Resume to continue unfinished questions.');render();}
else if(action==='reset'){halt();state=fresh();note('Demo reset. Original sample questions restored.');render();}
else if(action==='prepared'){const task=state.task;halt();state=fresh();state.task=task;newRun(true);}
else if(action==='start')newRun();
else if(action==='phase'){if(b.dataset.phase==='setup'&&r||b.dataset.phase!=='setup'&&!r)return;state.stage=b.dataset.phase;state.confirm='';state.message='';render();}
else if(action==='close'){state.open=false;render();}
else if(action==='reopen'){state.open=true;render();}
else if(action==='pause')pause();
else if(action==='skip')skip();
else if(action==='stop')stop();
else if(action==='previous'||action==='next'){r.index=Math.max(0,Math.min(r.items.length-1,r.index+(action==='next'?1:-1)));state.message='';render();}
else if(['accept-next','reject-next','reject'].includes(action))decision(action);
else if(action==='accept-all'||action==='reject-all')bulk(action==='accept-all');
else if(action==='select-retries'||action==='clear-retries'){r.items.filter(needsRetry).forEach(i=>i.retrySelected=action==='select-retries');render();}
else if(action==='retry-selected')retry(r.items.filter(i=>needsRetry(i)&&i.retrySelected).map(i=>i.id));
else if(action==='retry-one')retry([r.items[r.index].id]);
else if(action==='end'){if(counts().pending||r.items.some(needsRetry)){state.confirm='end';render();$('.content .stack>.panel:last-child')?.scrollIntoView({behavior:'instant',block:'center'});}else endTask();}
else if(action==='end-confirm')endTask();
else if(action==='cancel-end'){state.confirm='';state.stage='review';render();}
else if(action==='new-run'){state.stage='setup';state.message='';render();}
});
document.addEventListener('change',event=>{const e=event.target,control=e.dataset.control;
if(control==='task'&&!state.run){state.task=e.value;state.message='';render();}
else if(control==='scenario'&&!state.run){state.scenario=e.value;persist();}
else if(control==='delay'){const raw=Number(e.value);state.delay=Number.isFinite(raw)?Math.min(30,Math.max(0,raw)):0.7;e.value=state.delay;persist();if(state.run?.status==='active'&&!state.run.current&&!state.run.paused)afterResponse();}
else if(control==='jump'){state.run.index=Number(e.value);state.message='';render();}
else if(e.dataset.retryId){const i=state.run.items.find(q=>q.id===e.dataset.retryId);i.retrySelected=e.checked;const id=e.dataset.retryId;render();$(`[data-retry-id="${id}"]`)?.focus({preventScroll:true});}
});
setInterval(()=>{if(!state.run)return;if($('#live-title'))$('#live-title').textContent=liveTitle();if($('#live-detail'))$('#live-detail').textContent=liveDetail();if($('#closed-status')&&state.run.status!=='active')$('#closed-status').textContent='Generation is finished. Reopen to review the available proposals.';},150);
render();
</script>
</body>
</html>
